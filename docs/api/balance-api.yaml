openapi: 3.1.0
info:
  title: Balance API (assumed contract)
  version: 0.1.0
  description: >
    Proposed contract for the external Balance API, which receives monthly summaries from money-flow-backend.
    To be agreed with the API owners.
servers:
  - url: https://balance-api.example.com
security:
  - apiKey: []
paths:
  /monthly-balances/{accountId}/{month}:
    put:
      summary: Store an account's summary for one month
      description: >
        Idempotent per account and month. Sending a summary again replaces the previous value.
      operationId: putMonthlyBalance
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
        - name: month
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9]{4}-[0-9]{2}$"
            example: "2026-07"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MonthlyBalance"
      responses:
        "200":
          description: Existing summary replaced
        "201":
          description: Summary created
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    MonthlyBalance:
      type: object
      required: [accountId, month, currency, totalIncome, totalSpending, balance]
      properties:
        accountId:
          type: string
          example: ACC-123
        month:
          type: string
          example: "2026-07"
        currency:
          type: string
          example: EUR
        totalIncome:
          type: number
          example: 3000.00
        totalSpending:
          type: number
          example: 1000.00
        balance:
          type: number
          description: totalIncome - totalSpending. May be negative.
          example: 2000.00
